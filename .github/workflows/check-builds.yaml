name: Check builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-26.04 ]
        crypto: [ OPENSSL, MBEDTLS ]
        exclude:
          # These ship mbedTLS 2.28, we need 3.x
          - os: ubuntu-22.04
            crypto: MBEDTLS
          - os: ubuntu-24.04
            crypto: MBEDTLS

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Check compilers
      run: |
        which gcc
        which g++
        which clang
        which clang++

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev ninja-build libmbedtls-dev

        if [ "${{ matrix.os }}" = "ubuntu-24.04" ]
        then
          sudo apt-get install -y libcurl4t64
        else
          sudo apt-get install -y libcurl4
        fi

    - name: Configure CMake for gcc
      run: |
        cmake \
          -B ${{ github.workspace }}/build-gcc \
          -DCMAKE_C_COMPILER=/usr/bin/gcc \
          -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DSRTC_CRYPTO_LIB=${{ matrix.crypto }} \
          -GNinja

    - name: Build
      run: |
        cmake \
          --build ${{ github.workspace }}/build-gcc \
          --config ${{ env.BUILD_TYPE }} \
          --target srtc \
          --target srtc_test \
          --target srtc_publish \
          --target srtc_subscribe

    - name: Test
      run: |
        ${{github.workspace}}/build-gcc/srtc_test

    - name: Configure CMake for clang
      run: |
        cmake \
          -B ${{ github.workspace }}/build-clang \
          -DCMAKE_C_COMPILER=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DSRTC_CRYPTO_LIB=${{ matrix.crypto }} \
          -GNinja

    - name: Build
      run: |
        cmake \
          --build ${{ github.workspace }}/build-clang \
          --config ${{ env.BUILD_TYPE }} \
          --target srtc \
          --target srtc_test \
          --target srtc_publish \
          --target srtc_subscribe

    - name: Test
      run: |
        ${{github.workspace}}/build-clang/srtc_test

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        crypto: [ OPENSSL, MBEDTLS ]

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        # Plain mbedtls is 4.x, we need 3.x
        brew install openssl mbedtls@3 curl ninja

    - name: Configure CMake
      run: |
        cmake \
          -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DSRTC_CRYPTO_LIB=${{ matrix.crypto }} \
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) \
          -DCMAKE_PREFIX_PATH=$(brew --prefix mbedtls@3) \
          -GNinja

    - name: Build
      run: |
        cmake \
          --build ${{github.workspace}}/build \
          --config ${{env.BUILD_TYPE}} \
          --target srtc \
          --target srtc_test \
          --target srtc_publish \
          --target srtc_subscribe

    - name: Test
      run: |
        ${{github.workspace}}/build/srtc_test

  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6

    - name: Use the MSVC compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake `
          -B ${{github.workspace}}/build `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -GNinja

    - name: Build
      run: |
        cmake `
          --build ${{github.workspace}}/build `
          --config ${{env.BUILD_TYPE}} `
          --target srtc `
          --target srtc_test `
          --target srtc_publish `
          --target srtc_subscribe

    - name: Test
      run: |
        ${{github.workspace}}/build/srtc_test.exe
